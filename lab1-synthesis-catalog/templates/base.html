<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Synthesis Yield Catalog{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="app-screen">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav">
        <a href="/synthesis-feed/1" class="nav-item {% if active_page == 'feed' %}active{% endif %}">
            <svg viewBox="0 0 24 24"><path d="M9 3h6l1 6 3 8a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l3-8z"/></svg>
            <span>Лента</span>
        </a>
        <a href="/synthesis-draft" class="nav-item {% if active_page == 'draft' %}active{% endif %}">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>Добавить</span>
        </a>
        <a href="/synthesis-catalog" class="nav-item {% if active_page == 'catalog' %}active{% endif %}">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Каталог</span>
        </a>
    </nav>
</body>
</html>
