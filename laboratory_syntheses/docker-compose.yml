services:
  postgres:
    image: postgres:15-alpine
    container_name: synthesis-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: synthesis_user
      POSTGRES_PASSWORD: synthesis_password
      POSTGRES_DB: synthesis_db
    volumes:
      - synthesis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthesis_user -d synthesis_db"]
      interval: 2s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: synthesis-adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: synthesis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  

volumes:
  synthesis_postgres_data:
  minio_data:
