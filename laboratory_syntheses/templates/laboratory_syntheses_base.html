<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Лабораторные синтезы{% endblock %}</title>
    <link rel="stylesheet" href="/laboratory_syntheses/static/laboratory_syntheses.css?v=audit-20261018">
    {% if laboratory_syntheses_api_enabled %}
    <script src="/laboratory_syntheses/static/laboratory_syntheses.js?v=audit-20261018" defer></script>
    {% endif %}
</head>
<body class="page-{{ laboratory_syntheses_active_page }}">
    <main class="app-screen">
        {% block content %}{% endblock %}
    </main>
    <nav class="bottom-nav" aria-label="Основная навигация">
        <a href="/laboratory_syntheses/feed" class="nav-item {% if laboratory_syntheses_active_page == 'feed' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 6 3 8a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l3-8z"/></svg><span>Лента</span>
        </a>
        <a href="/laboratory_syntheses/draft" class="nav-item {% if laboratory_syntheses_active_page == 'draft' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/></svg><span>Добавить</span>
        </a>
        <a href="/laboratory_syntheses" class="nav-item {% if laboratory_syntheses_active_page == 'catalog' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Каталог</span>
        </a>
    </nav>
    <p class="sr-only" id="laboratory-synthesis-status" role="status" aria-live="polite"></p>
</body>
</html>
